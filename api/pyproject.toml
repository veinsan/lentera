[project]
name = "lentera-api"
version = "0.1.0"
description = "Lentera model service: preprocessing, LightGBM + DAE-MLP scoring, and planning for the DSCO at-risk model"
requires-python = "==3.13.*"
dependencies = [
    "numpy==2.5.4",
    "pandas==3.1.1",
    "scikit-learn==1.9.1",
    "fastapi[standard]",
    "pyjwt[crypto]",
    "lightgbm==4.6.0",
]

[dependency-groups]
dev = ["pytest"]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
